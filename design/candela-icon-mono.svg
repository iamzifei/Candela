<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8A8A8E"/>
    <stop offset="1" stop-color="#8A8A8E"/>
  </linearGradient>
  <!-- Diagonal so the sweep runs dim at the lower left to bright at the upper
       right, which is the direction the eye already reads a gauge in. -->
  <linearGradient id="sweep" x1="0.08" y1="0.95" x2="0.92" y2="0.05">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="1.0"/>
  </linearGradient>
  <clipPath id="shape">
    <rect x="84.0" y="80.0" width="856" height="856" rx="193" ry="193"/>
  </clipPath>
</defs>
<g clip-path="url(#shape)">
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <path d="M 330.70 671.24 A 243.96 243.96 0 1 1 693.30 671.24" fill="none" stroke="url(#sweep)"
        stroke-width="107.00" stroke-linecap="round"/>
  <circle cx="512.0" cy="508.0" r="85.60" fill="#FFFFFF"/>
</g>
</svg>
