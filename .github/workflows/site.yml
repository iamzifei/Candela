# The website in docs/ is GENERATED by site/build.py from site/content/.
# GitHub Pages serves docs/ as-is, so a hand edit to docs/ would go live and
# then be silently wiped by the next build. This job fails when docs/ and the
# sources disagree, so the drift shows up as a red check instead.
name: Site in sync

on:
  push:
    paths: ["docs/**", "site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", "site/**", ".github/workflows/site.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r site/requirements.txt
      - name: docs/ matches site/content
        run: |
          if ! python3 site/build.py --check; then
            echo "::error::docs/ is out of sync with site/. Edit site/content/ or site/build.py, run 'python3 site/build.py', and commit docs/ with it. Never edit docs/ by hand."
            exit 1
          fi
