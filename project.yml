name: Candela
options:
  bundleIdPrefix: com.candela
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - zh-Hant
    - Base

targets:
  Candela:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Candela
        excludes:
          - "**/*.md"
      # The layered icon, so an Xcode build produces the same icon the release
      # script does. Without it this target compiled the asset-catalog placeholder —
      # the grey grid — and because LaunchServices resolves com.candela.app to
      # whichever bundle it knows about, that placeholder was what System Settings
      # drew for Candela in the Privacy list while /Applications had the real thing.
      - path: Candela.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.candela.app
        # Without an explicit MARKETING_VERSION the generated Info.plist omits
        # CFBundleShortVersionString and the app self-reports 1.0.0 forever,
        # which keeps the update banner visible even on the latest release.
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "Candela - Free & Open Source"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Candela uses System Events to switch Dark Mode with the system's animated transition."
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Candela/Candela.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Candela/Candela-Bridging-Header.h
        # SLSConfigureDisplayEnabled / SLSGetDisplayList live in the private
        # SkyLight.framework (physical display disconnect). SkyLight is already
        # loaded in-process via AppKit, so mark just these two symbols as
        # resolved-at-runtime instead of hard-linking a private framework path.
        OTHER_LDFLAGS: "-Wl,-U,_SLSConfigureDisplayEnabled -Wl,-U,_SLSGetDisplayList"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Candela
  CandelaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    # The tests say `@testable import Candela`, so the app module has to exist before
    # they compile. Without this the only thing ordering them was luck: a stale
    # Candela.swiftmodule left in DerivedData by an earlier build. Delete DerivedData
    # (or check the repo out fresh, as CI does) and the whole suite stopped compiling.
    dependencies:
      - target: Candela
        embed: false
        link: false
    sources:
      - path: CandelaTests
      - path: Candela/Models/DisplayModeGeometry.swift
      - path: Candela/Models/DDCServiceMatcher.swift
      - path: Candela/Models/DDCReply.swift
      - path: Candela/Models/SoftwareDimming.swift
      - path: Candela/Models/CombinedBrightnessLevel.swift
      - path: Candela/Models/CombinedMapping.swift
      - path: Candela/Models/PanelRoute.swift
      - path: Candela/Models/RefreshRateFormat.swift
      - path: Candela/Models/GammaPersistenceKey.swift
      - path: Candela/Models/VariableRefreshModes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.candela.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  Candela:
    build:
      targets:
        Candela: all
    test:
      targets:
        - CandelaTests
