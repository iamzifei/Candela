<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: linear-gradient(180deg, #151619 0%, #0a0a0b 60%, #060607 100%);
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex; align-items: center; position: relative;
  }
  .backlight {
    position: absolute; left: 524px; top: -85px; width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 58%);
  }
  .grain {
    position: absolute; inset: 0; opacity: .05; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  }
  .left { padding: 0 0 0 84px; width: 640px; position: relative; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 40px; }
  .brand img { width: 76px; height: 76px; border-radius: 18px; }
  .brand span { font-size: 56px; font-weight: 700; letter-spacing: -.02em; }
  h1 {
    font-size: 52px; font-weight: 640; letter-spacing: -.025em; line-height: 1.1;
    margin-bottom: 28px;
  }
  .sub { font-size: 25px; color: #9c9ca3; line-height: 1.45; }
  .sub strong { color: #f5f5f7; font-weight: 600; }
  .shot {
    position: absolute; right: 76px; top: 50%; transform: translateY(-50%); width: 400px;
    border-radius: 18px; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
  }
</style>
</head>
<body>
  <div class="backlight"></div>
  <div class="left">
    <div class="brand"><img src="../../docs/icon.png" alt=""><span>Candela</span></div>
    <h1>macOS 藏起来的显示器控制，都装进这一个菜单栏面板。</h1>
    <p class="sub"><strong>免费开源，macOS 外接显示器控制。</strong>HiDPI 缩放、DDC 亮度，连 BetterDisplay 和 Lunar 的部分收费功能也免费。</p>
  </div>
  <img class="shot" src="../../docs/screenshot-zh.png" alt="">
  <div class="grain"></div>
</body>
</html>
